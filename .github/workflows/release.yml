name: release

# Nobody publishes from a laptop (ADR 0002 §4c). The version bump is a PR; the
# tag is what releases.
#
#   git tag hello@0.0.2 && git push origin hello@0.0.2
#
# **There is no npm credential here.** The first attempt used a granular access
# token and npm answered `EOTP`: the account requires 2FA for writes and the
# token may not bypass it. npm removes direct publish from 2FA-bypass tokens
# entirely in January 2027, so a token was never going to be the answer.
#
# Publishing goes through **trusted publishing (OIDC)** instead — GitHub proves
# which workflow is running and npm checks that against a trusted publisher
# registered on the package. Nothing standing is stored in GitHub, which is the
# same objection the deploy workflows make about SSH keys.
#
# A package's *first* publish cannot use this: a trusted publisher is configured
# on a package that already exists. Creating a package is a once-ever manual act
# with an interactive 2FA challenge.

on:
  push:
    tags: ['*@*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What replaces the token. Without it npm gets no OIDC assertion and the
      # publish falls back to asking for credentials that are not there.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # **No `registry-url`.** With it, actions/setup-node writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and, when no token secret is
      # supplied, sets that variable to the literal placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX`. npm then authenticates with a bogus token
      # instead of exchanging an OIDC assertion, and the registry answers `404
      # Not Found` on the PUT — which reads as "the package does not exist"
      # rather than "your credential is nonsense". Measured on the first attempt
      # at this release.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read the package and version out of the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG%@*}"    >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a tag that will forever point at the wrong commit. npm accepts
      # it silently, so this is the only place it can be caught.
      - name: The tag agrees with package.json
        run: |
          DIR="packages/${{ steps.tag.outputs.name }}"
          ACTUAL=$(node -p "require('./$DIR/package.json').version")
          if [ "$ACTUAL" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.tag.outputs.version }}, $DIR/package.json says $ACTUAL"
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough one,
      # but the failure if it ever regresses is the same misleading 404.
      - name: Versions
        run: node -v && npm -v

      - run: npm ci
      - run: npm run build -w "packages/${{ steps.tag.outputs.name }}"

      # `publishConfig.access: public` lives in every package.json, so a scoped
      # package cannot fail its first publish looking like a permissions bug.
      # `--provenance` is deliberately absent: it attests to a *public* source
      # commit and this repo is private.
      - name: Publish
        run: npm publish -w "packages/${{ steps.tag.outputs.name }}"
