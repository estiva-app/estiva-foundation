name: check conversation

# One workflow per package, filtered by path — ADR 0002 §2. A change to
# `protocol` must not run `ui`'s jsdom tests, or a flaky UI test becomes a
# blocked wire-format release.
#
# Known cost of `paths`: a PR touching no package never runs this job, so it
# cannot be a *required* check that must report success.
#
# Copied from check-interop.yml in the PR that created the package (CON-5), so
# it never repeats interop's four releases with no check at all. The suite is
# SPEC §9's C10–C16 as fixtures (test/conformance.test.ts).

on:
  push:
    branches: [main]
    paths:
      ['packages/conversation/**', '.github/workflows/check-conversation.yml', 'tsconfig.base.json', 'tsconfig.base.test.json']
  pull_request:
    paths:
      ['packages/conversation/**', '.github/workflows/check-conversation.yml', 'tsconfig.base.json', 'tsconfig.base.test.json']

concurrency:
  group: check-conversation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/conversation

      # Both passes: the package's own `types: []` build, and a second one over
      # `test/*.test.ts`. `node --test` strips types rather than checking them,
      # which is the hole vitest has too — see check-interop.yml for what it
      # caught there.
      - run: npm run typecheck -w packages/conversation

      - run: npm test -w packages/conversation

      # The emitted specifier is the thing three toolchains disagree about, and
      # it is invisible until a consumer's build fails. `tsc` copies relative
      # specifiers through untouched, so an extensionless one ships broken.
      - name: Emitted relative imports carry a .js extension
        run: |
          BAD=$(grep -rhoE "from '\\.[^']*'" packages/conversation/dist/*.js | grep -v "\\.js'$" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Extensionless relative import in the emitted output — Node will not resolve it: $BAD"
            exit 1
          fi

      # The guard for the *emitted declarations*: a `.d.ts` naming a DOM or Node
      # type compiles in Peek (types: ["vite/client"]) and fails in Ship
      # (types: ["node"]), or the reverse, and neither repo's CI would say why.
      # This package is deliberately handed its relay as a function rather than
      # opening a socket, which is what keeps the list below empty — the guard
      # is what stops that drifting.
      #
      # Comments are stripped first: the prose talks about `fetch` and
      # `WebSocket` constantly, and it should be able to.
      - name: The published declarations name no DOM or Node global
        run: |
          BAD=$(cat packages/conversation/dist/*.d.ts \
            | sed -E 's:/\*.*\*/::g' \
            | awk '/\/\*/{c=1} !c{print} /\*\//{c=0}' \
            | sed -E 's://.*$::' \
            | grep -nE '\b(WebSocket|Window|Document|HTMLElement|HTMLButtonElement|Element|Response|Request|Headers|Storage|NodeJS|Buffer|ProcessEnv|Timeout)\b' || true)
          if [ -n "$BAD" ]; then
            echo "::error::A published declaration reaches for an ambient global. Make it a parameter or declare the shape locally (ADR 0002 §4a): $BAD"
            exit 1
          fi

      # ADR 0002 §10 constraint 2. This package is what a consumer adds to read
      # its conversations; a runtime dependency here lands in every one of
      # their trees. `protocol` is a peer on purpose, so a consumer that already
      # has it does not get a second copy at a different major.
      - name: protocol stays a peer, and nothing else is a runtime dependency
        run: |
          node -e "
            const p = require('./packages/conversation/package.json');
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) {
              console.error('::error::Unexpected runtime dependency: ' + deps.join(', '));
              process.exit(1);
            }
            if (!(p.peerDependencies || {})['@estiva-app/protocol']) {
              console.error('::error::@estiva-app/protocol must stay a peerDependency — as a dependency it ships a second copy into every consumer that already has one');
              process.exit(1);
            }
          "
